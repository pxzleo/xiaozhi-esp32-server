# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 1000
      min-spare: 30
  port: 8002
  servlet:
    context-path: /xiaozhi
    session:
      cookie:
        http-only: true

spring:
  # 环境 dev|test|prod
  profiles:
    active: dev
  messages:
    encoding: UTF-8
    basename: i18n/messages
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  main:
    allow-bean-definition-overriding: true

knife4j:
  enable: true
  basic:
    enable: false
    username: admin
    password: admin
  setting:
    enableFooter: false

renren:
  redis:
    open: true
  xss:
    enabled: true
    exclude-urls:

#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: xiaozhi.modules.*.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型
      id-type: ASSIGN_ID
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  configuration-properties:
    prefix:
    blobType: BLOB
    boolValue: TRUE

netease-music:
  api-base-url: ${NETEASE_MUSIC_API_BASE_URL:http://127.0.0.1:3000}
  public-base-url: ${NETEASE_MUSIC_PUBLIC_BASE_URL:http://192.168.100.149/xiaozhi}

logging:
  level:
    # 授权表包含加密凭证，会话表包含二维码原文和加密 key，禁止 MyBatis 输出 SQL 参数。
    xiaozhi.modules.device.netease.DeviceNeteaseAuthDao: INFO
    xiaozhi.modules.device.netease.DeviceNeteaseSessionDao: INFO
    # 手机事件表包含脱敏摘要，仍不得由 MyBatis DEBUG 输出 SQL 参数。
    xiaozhi.modules.mobile.MobileEventDao: INFO
